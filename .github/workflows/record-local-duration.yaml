name: Record Local Duration Check

on:
  push:
    branches:
      - playground/maestro-docs-ios-issue-194

jobs:
  record-local-duration:
    name: Record local flow
    runs-on: macos-15-intel
    timeout-minutes: 60

    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
      MAESTRO_CLI_LOG_PATTERN_CONSOLE: "%d{HH:mm:ss.SSS} [%5level] %logger.%method: %msg%n"

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Build Maestro CLI
        run: ./gradlew :maestro-cli:distZip

      - name: Add Maestro CLI executable to PATH
        run: |
          unzip maestro-cli/build/distributions/maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Check if Maestro CLI executable starts up
        run: |
          maestro --help
          maestro --version

      - name: Build demo app for iOS
        uses: ./.github/actions/build-demo-app
        with:
          platform: ios

      - name: Boot Simulator
        run: |
          xcrun simctl list runtimes
          export RUNTIME="iOS18.5"
          export DEVICE_TYPE="iPhone 16"
          ./.github/scripts/boot_simulator.sh

      - name: Install demo app
        run: |
          xcrun simctl install booted e2e/apps/demo_app.app
          xcrun simctl get_app_container booted com.example.example app

      - name: Prepare local recording flow
        run: |
          cat > "$RUNNER_TEMP/record_local_duration.yaml" <<'EOF'
          appId: com.example.example
          name: Record local duration smoke test
          tags:
            - passing
          ---
          - launchApp:
              clearState: true

          - tapOn: "Animation Test"

          # Keep the flow alive for about two minutes using Maestro commands only.
          - repeat:
              times: 4
              commands:
                - tapOn:
                    text: "Animate (30s)"
                    waitToSettleTimeoutMs: 100
                - waitForAnimationToEnd
          EOF

      - name: Run local recording
        working-directory: ${{ github.workspace }}
        timeout-minutes: 40
        run: maestro --platform ios record --local "$RUNNER_TEMP/record_local_duration.yaml" e2e/demo_app/.maestro/record_local_duration.mp4

      - name: Upload recording artifact
        uses: actions/upload-artifact@v7
        with:
          name: record-local-duration-mp4
          path: e2e/demo_app/.maestro/record_local_duration.mp4
          retention-days: 7
