name: Blog Maestro Artifacts

on:
  workflow_dispatch:

jobs:
  build-cli:
    name: Build Maestro CLI
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Build Maestro CLI
        run: ./gradlew :maestro-cli:distZip

      - name: Upload Maestro CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: maestro-cli-blog-run_id${{ github.run_id }}
          path: maestro-cli/build/distributions/maestro.zip
          retention-days: 1

  blog-android:
    name: Run blog artifact sample on Android
    runs-on: ubuntu-latest
    needs: build-cli
    timeout-minutes: 60

    env:
      ANDROID_HOME: /home/runner/androidsdk
      ANDROID_SDK_ROOT: /home/runner/androidsdk
      ANDROID_AVD_HOME: /home/runner/.config/.android/avd/
      ANDROID_OS_IMAGE: system-images;android-32;google_apis;x86_64
      MAESTRO_APP: demo_app
      MAESTRO_FLOW_PATH: demo_app/.maestro/blog_artifact_capture.yaml

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android Command-line Tools
        run: |
          sh .github/scripts/install_android_sdk https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $GITHUB_PATH

      - name: Set up Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install emulator
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          sdkmanager --install "platform-tools"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          sdkmanager --install "$ANDROID_OS_IMAGE"

      - name: Build demo_app
        uses: ./.github/actions/build-demo-app
        with:
          platform: android

      - name: Download Maestro CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: maestro-cli-blog-run_id${{ github.run_id }}

      - name: Add Maestro CLI executable to PATH
        run: |
          unzip maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Check if Maestro CLI executable starts up
        run: |
          maestro --help
          maestro --version

      - name: Create AVD
        run: |
          avdmanager -s create avd \
            --package "$ANDROID_OS_IMAGE" \
            --name "MyAVD"

          cat << EOF >> ~/.config/.android/avd/MyAVD.avd/config.ini
          hw.cpu.ncore=4
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.ramSize=4192
          disk.dataPartition.size=6442450944
          vm.heapSize=112M
          hw.lcd.density=240
          hw.lcd.height=1280
          hw.lcd.width=606
          EOF

      - name: Run AVD
        run: |
          emulator @MyAVD \
            -verbose -no-snapshot -no-window -no-audio -no-boot-anim -accel on -no-metrics -camera-back emulated \
            >~/emulator_stdout.log \
            2>~/emulator_stderr.log &

      - name: Wait for AVD to start up and configure CI pre-conditions
        run: bash .github/scripts/setup_android_device.sh

      - name: Install apps
        working-directory: ${{ github.workspace }}/e2e
        run: ./install_apps android

      - name: Run blog sample
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 30
        run: >
          maestro --verbose --no-ansi --platform android test
          --test-output-dir=build/maestro-artifacts/android/demo_app/flow
          --debug-output=build/maestro-debug/android/demo_app/flow
          --format=junit
          --output=build/android-demo_app-flow/results-flow.xml
          demo_app/.maestro/blog_artifact_capture.yaml

      - name: Summarize Maestro outputs
        if: success() || failure()
        working-directory: ${{ github.workspace }}/e2e
        run: |
          echo "MAESTRO_APP=${MAESTRO_APP:-}"
          echo "MAESTRO_FLOW_PATH=${MAESTRO_FLOW_PATH:-}"
          echo
          echo "Generated files under e2e/build:"
          if [ -d build ]; then
            find build -type f | sort
          else
            echo "build directory not found"
          fi

      - name: Upload Maestro test artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-test-artifacts-android
          path: e2e/build/maestro-artifacts
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Maestro debug output
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-output-android
          path: e2e/build/maestro-debug
          retention-days: 7
          if-no-files-found: warn

      - name: Upload JUnit XML
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-junit-android
          path: e2e/build/*/results-*.xml
          retention-days: 7
          if-no-files-found: error

      - name: Upload ~/.maestro artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-root-dir-android
          path: ~/.maestro
          retention-days: 7
          include-hidden-files: true

  blog-ios:
    name: Run blog artifact sample on iOS
    runs-on: macos-26
    needs: build-cli
    timeout-minutes: 120

    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
      MAESTRO_CLI_LOG_PATTERN_CONSOLE: "%d{HH:mm:ss.SSS} [%5level] %logger.%method: %msg%n"
      MAESTRO_APP: demo_app
      MAESTRO_FLOW_PATH: demo_app/.maestro/blog_artifact_capture.yaml

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Build demo_app
        uses: ./.github/actions/build-demo-app
        with:
          platform: ios

      - name: Download Maestro CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: maestro-cli-blog-run_id${{ github.run_id }}

      - name: Add Maestro CLI executable to PATH
        run: |
          unzip maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Check if Maestro CLI executable starts up
        run: |
          maestro --help
          maestro --version

      - name: Boot Simulator
        env:
          DEVICE_TYPE: iPhone 17 Pro
          RUNTIME: iOS26.2
        run: ./.github/scripts/boot_simulator.sh

      - name: Install apps
        working-directory: ${{ github.workspace }}/e2e
        run: ./install_apps ios

      - name: Run blog sample
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 120
        run: >
          maestro --verbose --no-ansi --platform ios test
          --test-output-dir=build/maestro-artifacts/ios/demo_app/flow
          --debug-output=build/maestro-debug/ios/demo_app/flow
          --format=junit
          --output=build/ios-demo_app-flow/results-flow.xml
          demo_app/.maestro/blog_artifact_capture.yaml

      - name: Summarize Maestro outputs
        if: success() || failure()
        working-directory: ${{ github.workspace }}/e2e
        run: |
          echo "MAESTRO_APP=${MAESTRO_APP:-}"
          echo "MAESTRO_FLOW_PATH=${MAESTRO_FLOW_PATH:-}"
          echo
          echo "Generated files under e2e/build:"
          if [ -d build ]; then
            find build -type f | sort
          else
            echo "build directory not found"
          fi

      - name: Upload Maestro test artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-test-artifacts-ios
          path: e2e/build/maestro-artifacts
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Maestro debug output
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-output-ios
          path: e2e/build/maestro-debug
          retention-days: 7
          if-no-files-found: warn

      - name: Upload JUnit XML
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-junit-ios
          path: e2e/build/*/results-*.xml
          retention-days: 7
          if-no-files-found: error

      - name: Upload ~/.maestro artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-root-dir-ios
          path: ~/.maestro
          retention-days: 7
          include-hidden-files: true

  blog-web:
    name: Run blog artifact sample on Web
    runs-on: ubuntu-latest
    needs: build-cli
    timeout-minutes: 30

    env:
      MAESTRO_APP: demo_app
      MAESTRO_FLOW_PATH: demo_app/.maestro/blog_artifact_capture_web.yaml

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 142

      - name: Download Maestro CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: maestro-cli-blog-run_id${{ github.run_id }}

      - name: Add Maestro CLI executable to PATH
        run: |
          unzip maestro.zip -d maestro_extracted
          echo "$PWD/maestro_extracted/maestro/bin" >> $GITHUB_PATH

      - name: Check if Maestro CLI executable starts up
        run: |
          maestro --help
          maestro --version

      - name: Run blog sample
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 30
        run: >
          maestro --verbose --no-ansi --platform web test
          --headless
          --test-output-dir=build/maestro-artifacts/web/demo_app/flow
          --debug-output=build/maestro-debug/web/demo_app/flow
          --format=junit
          --output=build/web-demo_app-flow/results-flow.xml
          demo_app/.maestro/blog_artifact_capture_web.yaml

      - name: Summarize Maestro outputs
        if: success() || failure()
        working-directory: ${{ github.workspace }}/e2e
        run: |
          echo "MAESTRO_APP=${MAESTRO_APP:-}"
          echo "MAESTRO_FLOW_PATH=${MAESTRO_FLOW_PATH:-}"
          echo
          echo "Generated files under e2e/build:"
          if [ -d build ]; then
            find build -type f | sort
          else
            echo "build directory not found"
          fi

      - name: Upload Maestro test artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-test-artifacts-web
          path: e2e/build/maestro-artifacts
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Maestro debug output
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-output-web
          path: e2e/build/maestro-debug
          retention-days: 7
          if-no-files-found: warn

      - name: Upload JUnit XML
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-junit-web
          path: e2e/build/*/results-*.xml
          retention-days: 7
          if-no-files-found: error

      - name: Upload ~/.maestro artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-root-dir-web
          path: ~/.maestro
          retention-days: 7
          include-hidden-files: true
