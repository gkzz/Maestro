appId: com.example.example
name: Record local duration smoke test
tags:
  - passing
---
- launchApp:
    clearState: true

- tapOn: "Animation Test"

# Keep the flow alive for about three minutes using Maestro commands only.
- repeat:
    times: 6
    commands:
      - tapOn:
          text: "Animate (30s)"
          waitToSettleTimeoutMs: 100
      - waitForAnimationToEnd
